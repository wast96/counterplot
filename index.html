<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f0e7">
<meta name="description" content="Counterplot is a private, modular workshop for characters, choices, and the stories they set in motion.">
<title>Counterplot — Master Plot & Shared MICE</title>
<style>
:root {
  --paper: #f5f2e9;
  --sheet: #fffcf6;
  --rail: #eeece3;
  --ink: #272d27;
  --muted: #66695f;
  --line: #d5d6c9;
  --accent: #a14531;
  --accent-soft: #f2e1d7;
  --sage: #e0e6d7;
  --sage-dark: #3e5847;
  --gold: #eadcba;
  --white: #fffefb;
  --serif: Georgia,'Times New Roman',serif;
  --sans: 'Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono: 'SFMono-Regular',Consolas,'Liberation Mono',monospace;
  --shadow: 0 14px 55px #1f29271c
}
* {
  box-sizing: border-box
}
html {
  scroll-behavior: smooth
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased
}
button,input,select,textarea {
  font: inherit
}
button,a,input,textarea,select {
  -webkit-tap-highlight-color: transparent
}
button {
  cursor: pointer;
  color: inherit
}
button:disabled {
  cursor: not-allowed;
  opacity: .42
}
button {
  border: 0;
  background: none
}
a {
  color: inherit;
  text-underline-offset: 3px
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px
}
input,textarea,select {
  color: var(--ink);
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 11px 12px;
  max-width: 100%;
  width: 100%
}
textarea {
  min-height: 95px;
  resize: vertical;
  line-height: 1.6
}
input::placeholder,textarea::placeholder {
  color: #75796d;
  opacity: 1
}
select {
  min-height: 44px
}
input[type=checkbox],input[type=radio] {
  width: 17px;
  height: 17px;
  accent-color: var(--sage-dark);
  margin: 0;
  flex: 0 0 auto
}
label {
  display: block
}
.field-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 7px
}
.field-help {
  font-size: 12px;
  color: var(--muted);
  margin: 7px 0 0;
  line-height: 1.5
}
.field {
  margin-bottom: 19px
}
.fields-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px
}
.eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.7px;
  font-weight: 500;
  line-height: 1.5;
  text-transform: uppercase
}
.muted {
  color: var(--muted)
}
.serif {
  font-family: var(--serif)
}
.small {
  font-size: 12px
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap
}
.skip {
  position: fixed;
  top: -70px;
  left: 20px;
  padding: 12px;
  background: var(--ink);
  color: var(--white);
  z-index: 200
}
.skip:focus {
  top: 8px
}
.topbar {
  height: 82px;
  border-bottom: 1px solid var(--ink);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 21px;
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 30
}
.wordmark {
  font-family: var(--serif);
  font-size: 29px;
  font-weight: bold;
  letter-spacing: -1.55px;
  text-decoration: none;
  display: flex;
  align-items: center;
  white-space: nowrap
}
.wordmark-dot {
  color: var(--accent)
}
.mark {
  border: 1px solid var(--ink);
  width: 29px;
  height: 30px;
  margin-right: 10px;
  font-family: var(--serif);
  font-size: 23px;
  line-height: 24px;
  letter-spacing: -4px;
  position: relative;
  padding-left: 2px;
  align-self: center;
  font-weight: normal
}
.mark span {
  color: var(--accent);
  position: relative;
  top: 6px
}
.top-separator {
  height: 22px;
  border-left: 1px solid var(--line)
}
.project-switch {
  font-size: 13px;
  display: flex;
  gap: 15px;
  align-items: center;
  min-width: 90px;
  max-width: 240px;
  text-align: left;
  padding: 8px 0
}
.project-switch>span:first-child {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}
.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 9px
}
.save-status {
  font-size: 11px;
  color: var(--muted);
  margin-right: 10px;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap
}
.status-dot {
  width: 6px;
  height: 6px;
  display: inline-block;
  border-radius: 50%;
  background: var(--sage-dark);
  flex: 0 0 auto
}
.save-status.error {
  color: var(--accent)
}
.save-status.error .status-dot {
  background: var(--accent)
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--white);
  padding: 12px 17px;
  min-height: 43px;
  border-radius: 2px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.3;
  transition: background .14s,color .14s,transform .14s
}
.button:hover:not(:disabled) {
  background: var(--sage-dark);
  border-color: var(--sage-dark)
}
.button.secondary {
  background: transparent;
  color: var(--ink);
  border-color: var(--line)
}
.button.secondary:hover:not(:disabled) {
  background: var(--sage);
  border-color: #bec8b6
}
.button.rust {
  background: var(--accent);
  border-color: var(--accent)
}
.button.rust:hover {
  background: #823525
}
.button.compact {
  padding: 8px 13px;
  min-height: 36px;
  font-size: 12px
}
.button.white {
  background: var(--sheet);
  color: var(--ink);
  border-color: var(--sheet)
}
.button.full {
  width: 100%
}
.quiet {
  padding: 7px 9px;
  font-size: 12px;
  min-height: 36px;
  border-radius: 2px
}
.quiet:hover {
  background: #272d2709
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  min-height: 34px;
  flex: 0 0 auto;
  font-size: 20px;
  border-radius: 2px
}
.icon-btn:hover {
  background: #272d270a
}
.icon-btn svg {
  width: 16px;
  height: 16px
}
.text-button {
  color: var(--ink);
  font-size: 12px;
  padding: 3px 0;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid transparent;
  min-height: 29px;
  text-align: left
}
.text-button:hover {
  border-bottom-color: var(--ink)
}
.text-button.accent {
  color: var(--accent)
}
.text-button.danger {
  color: var(--accent)
}
kbd {
  font-family: var(--mono);
  font-size: 10px;
  margin-left: 7px;
  border: 1px solid var(--line);
  padding: 2px 4px;
  border-radius: 2px
}
.app-layout {
  display: grid;
  grid-template-columns: 217px minmax(0,1fr);
  min-height: calc(100vh - 82px)
}
.rail {
  background: var(--rail);
  border-right: 1px solid var(--line);
  padding: 30px 19px 22px;
  position: sticky;
  top: 82px;
  height: calc(100vh - 82px);
  display: flex;
  flex-direction: column;
  overflow: auto
}
.rail-kicker {
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  margin: 0 8px 18px
}
.rail-kicker span {
  font-size: 9px;
  letter-spacing: 0
}
.nav-item {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 13px;
  padding: 11px 11px;
  margin-bottom: 3px;
  text-decoration: none;
  font-size: 13px;
  border-radius: 2px;
  min-height: 43px;
  position: relative
}
.nav-item .nav-icon {
  font-size: 17px;
  width: 20px;
  height: 21px;
  display: flex;
  align-items: center;
  justify-content: center
}
.nav-item .nav-icon svg {
  width: 19px;
  height: 19px
}
.nav-item.active {
  background: var(--ink);
  color: var(--white)
}
.nav-item:not(.active):hover {
  background: #272d2708
}
.nav-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  opacity: .7
}
.rail-cast {
  margin-top: 32px;
  padding: 0 8px
}
.rail-cast-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 13px;
  color: var(--muted)
}
.rail-cast-header .icon-btn {
  font-size: 20px;
  min-height: 26px;
  width: 25px
}
.rail-person {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  text-align: left;
  padding: 8px 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.3
}
.rail-person>span:nth-child(2) {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap
}
.rail-person.selected {
  color: var(--ink);
  font-weight: 600
}
.person-square {
  width: 23px;
  height: 24px;
  flex: 0 0 auto;
  border: 1px solid var(--line);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 12px;
  color: var(--ink);
  background: var(--paper)
}
.selected .person-square {
  background: var(--sage);
  border-color: #bac4b1
}
.rail-note {
  font-size: 12px;
  line-height: 1.65;
  color: var(--muted)
}
.rail-bottom {
  margin-top: auto;
  padding: 40px 8px 0
}
.small-rule {
  width: 28px;
  border-top: 2px solid var(--accent);
  margin-bottom: 14px
}
.rail-bottom p {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8
}
.local-label {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  margin-top: 25px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted)
}
.workspace {
  min-width: 0
}
#main {
  padding: 35px 38px 55px;
  max-width: 1630px;
  margin: auto;
  outline: none
}
.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 29px
}
.page-heading .eyebrow {
  color: var(--muted)
}
.page-heading h1 {
  font-family: var(--serif);
  font-weight: normal;
  letter-spacing: -1.5px;
  font-size: 42px;
  line-height: 1.12;
  margin: 12px 0 9px;
  overflow-wrap: anywhere
}
.page-heading .description {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  max-width: 650px
}
.page-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end
}
.page-index {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--muted)
}
.split {
  display: grid;
  grid-template-columns: minmax(0,1fr) 260px;
  gap: 32px;
  align-items: start
}
.content-column {
  min-width: 0
}
.margin-column {
  border-left: 1px solid var(--line);
  padding-left: 25px;
  min-width: 0
}
.margin-section {
  padding: 5px 0 24px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line)
}
.margin-section:last-child {
  border-bottom: 0
}
.margin-section h3 {
  font-family: var(--serif);
  font-size: 23px;
  line-height: 1.24;
  letter-spacing: -.5px;
  font-weight: normal;
  margin: 12px 0
}
.margin-section p {
  font-size: 12px;
  line-height: 1.8;
  color: var(--muted)
}
.margin-section .eyebrow {
  color: var(--muted);
  font-size: 9px
}
.margin-number {
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  display: block;
  color: var(--accent);
  margin-bottom: 12px
}
.margin-prompt {
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.5;
  margin: 15px 0 20px
}
.margin-prompt em {
  color: var(--accent);
  font-style: normal
}
.next-step {
  padding: 19px;
  background: var(--sage);
  margin: 0 0 20px
}
.next-step p {
  font-size: 12px;
  color: var(--sage-dark);
  margin: 8px 0 14px;
  line-height: 1.7
}
.next-step .eyebrow {
  font-size: 9px;
  color: var(--sage-dark)
}
.empty-hero {
  background: var(--sheet);
  border: 1px solid var(--line);
  padding: 42px 38px 36px;
  position: relative;
  overflow: hidden
}
.empty-hero .eyebrow {
  color: var(--accent)
}
.empty-hero h2 {
  font-family: var(--serif);
  font-weight: normal;
  font-size: clamp(37px,3.7vw,61px);
  line-height: 1.08;
  letter-spacing: -2.2px;
  max-width: 550px;
  margin: 23px 0
}
.empty-hero h2 em {
  font-weight: normal;
  color: var(--sage-dark)
}
.empty-hero>p {
  color: var(--muted);
  max-width: 450px;
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 25px
}
.seed-line {
  display: flex;
  align-items: stretch;
  margin-top: 39px;
  border-top: 1px solid var(--line);
  padding-top: 29px;
  gap: 0
}
.seed-piece {
  flex: 1;
  min-width: 0;
  border-right: 1px solid var(--line);
  padding: 0 16px
}
.seed-piece:first-child {
  padding-left: 0
}
.seed-piece:last-child {
  border: 0;
  padding-right: 0
}
.seed-piece .eyebrow {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 1px
}
.seed-piece strong {
  font-family: var(--serif);
  font-size: 21px;
  display: block;
  font-weight: normal;
  margin: 6px 0;
  letter-spacing: -.4px
}
.seed-piece p {
  font-size: 11px;
  line-height: 1.7;
  color: var(--muted);
  margin: 0
}
.below-note {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  margin: 14px 0 0;
  color: var(--muted);
  font-size: 11px
}
.empty-secondary {
  margin-top: 30px;
  border-top: 1px solid var(--line);
  padding-top: 20px;
  display: flex;
  align-items: center;
  gap: 18px
}
.empty-secondary .ordinal {
  font-family: var(--serif);
  font-size: 31px;
  color: var(--muted);
  font-style: italic
}
.empty-secondary p {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  max-width: 450px
}
.empty-secondary strong {
  display: block;
  color: var(--ink);
  font-weight: 500;
  margin-bottom: 4px
}
.character-topline {
  display: flex;
  align-items: center;
  gap: 9px
}
.name-button {
  text-align: left;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0
}
.name-button h1 {
  margin-top: 10px
}
.name-button svg {
  width: 15px;
  flex: 0 0 auto;
  opacity: 0;
  transition: opacity .15s
}
.name-button:hover svg,.name-button:focus-visible svg {
  opacity: 1
}
.character-number {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted)
}
.core-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px
}
.block-card {
  background: var(--sheet);
  border: 1px solid var(--line);
  min-width: 0;
  position: relative;
  min-height: 162px;
  display: flex;
  flex-direction: column;
  transition: border-color .15s,box-shadow .15s
}
.block-card:hover {
  border-color: #a7af9f
}
.block-card.empty {
  background: transparent;
  min-height: 153px;
  border-style: dashed
}
.block-top {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  align-items: center;
  padding: 13px 16px 0
}
.block-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1.3px;
  color: var(--muted);
  text-transform: uppercase;
  display: flex;
  gap: 8px;
  align-items: center
}
.kind-mark {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--sage-dark)
}
.kind-want .kind-mark {
  background: var(--accent)
}
.kind-value .kind-mark {
  background: #8a713c
}
.kind-boundary .kind-mark {
  background: #7a7b68
}
.block-top .icon-btn {
  font-size: 12px;
  width: 25px;
  min-height: 24px
}
.block-top .icon-btn.pinned {
  color: var(--accent);
  background: var(--accent-soft)
}
.block-main {
  display: block;
  text-align: left;
  width: 100%;
  padding: 12px 17px 17px;
  flex: 1
}
.block-main h3 {
  font-family: var(--serif);
  font-weight: normal;
  font-size: 24px;
  line-height: 1.22;
  letter-spacing: -.5px;
  margin: 0 0 7px;
  overflow-wrap: anywhere
}
.block-main h3 .target {
  color: var(--sage-dark)
}
.block-main p {
  font-size: 11px;
  color: var(--muted);
  margin: 6px 0 0;
  line-height: 1.7;
  overflow-wrap: anywhere
}
.block-empty-button {
  padding: 14px 17px 23px;
  width: 100%;
  text-align: left;
  flex: 1
}
.block-empty-button>span {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: normal;
  line-height: 1.2;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #686d60
}
.block-empty-button>span b {
  font-family: var(--sans);
  font-weight: 300;
  font-size: 25px;
  color: var(--accent)
}
.block-empty-button p {
  font-size: 11px;
  line-height: 1.65;
  color: var(--muted);
  margin: 10px 0 0;
  max-width: 260px
}
.block-foot {
  padding: 0 16px 12px;
  font-size: 10px;
  color: var(--muted)
}
.section-bar {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin: 30px 0 14px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 11px
}
.section-bar h2 {
  font-family: var(--serif);
  font-weight: normal;
  letter-spacing: -.4px;
  font-size: 23px;
  margin: 0
}
.section-bar .eyebrow {
  font-size: 9px;
  color: var(--muted)
}
.add-block {
  border: 1px dashed #aab39f;
  margin-top: 14px;
  width: 100%;
  padding: 14px;
  text-align: center;
  font-size: 12px;
  min-height: 44px;
  color: var(--sage-dark)
}
.add-block:hover {
  background: var(--sage)
}
.detail-blocks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px
}
.detail-blocks .block-card {
  min-height: 140px
}
.detail-blocks .block-main h3 {
  font-size: 21px
}
.no-detail {
  border-top: 1px solid var(--line);
  margin-top: 26px;
  padding-top: 19px;
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 20px
}
.no-detail p {
  font-size: 12px;
  color: var(--muted);
  max-width: 370px;
  margin: 0
}
.details-box {
  border-top: 1px solid var(--line);
  margin-top: 26px;
  padding-top: 14px
}
.details-box summary {
  font-size: 12px;
  cursor: pointer;
  min-height: 30px
}
.details-box p {
  font-size: 13px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--muted)
}
.details-box>div {
  padding-top: 15px
}
.token-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px
}
.token {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  background: var(--sheet);
  font-size: 11px;

/* Counterplot 5 / a direct, tactile outline. No global canvas or modal editor. */
.mice-board-toolbar {display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-block:1px solid var(--line);padding:13px 0;margin:18px 0 10px;}

.mice-board .mice-branch {min-width:0;border:1px solid var(--line);border-left:3px solid var(--mice-color,#848877);border-radius:4px;background:var(--sheet);margin:14px 0;overflow:visible;transition:box-shadow .16s;}

.mice-board .mice-children {margin:0 14px 0 var(--nest-space,22px);padding:0;min-width:0;}
.mice-board .mice-children[hidden],.mice-board [hidden],.mice-inline-details[hidden] {display:none!important;}

.mice-board .mice-ending::before,.mice-board .mice-node::before {display:none;}

.mice-board .mice-node-actions .text-button {font-size:11px;padding:5px 0;}
.mice-board .mice-type-control {display:flex;align-items:center;gap:6px;flex:none;font-size:11px;font-weight:500;}

.mice-type-control:hover select {background:var(--paper);}
.mice-handle {display:flex;align-items:center;justify-content:center;flex:none;width:28px;height:32px;cursor:grab;border-radius:3px;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--muted);margin-left:-6px;}
.mice-handle svg {fill:currentColor;}
.mice-handle:hover,.mice-handle:focus-visible {background:var(--sage);color:var(--sage-dark);}
.mice-handle:active {cursor:grabbing;}
.mice-linked-meta {font-size:11px;color:var(--muted);overflow-wrap:anywhere;min-width:0;flex:1;}
.mice-layer {font:10px var(--mono);color:var(--muted);flex:none;}
.mice-board .mice-fold {margin-left:auto;flex:none;width:32px;height:32px;}
.mice-board .mice-short-title {font:19px var(--serif);margin:4px 0 7px;overflow-wrap:anywhere;}
.mice-editable {display:block;margin:4px 0 0;min-width:0;}

.mice-editable textarea {display:block;resize:vertical;width:100%;min-width:0;min-height:32px;max-height:380px;margin:0;padding:6px 7px;border:1px solid transparent;background:transparent;border-radius:3px;line-height:1.5;font-size:15px;box-sizing:border-box;overflow-y:auto;overflow-wrap:anywhere;transition:background .12s,border-color .12s;}

/* Floating MICE insertion palette — deliberately tactile, not dashboard chrome. */
.mice-palette{
  position:fixed;
  z-index:58;
  left:calc(50% + 108px);
  bottom:22px;
  transform:translateX(-50%);
  min-width:318px;
  max-width:calc(100vw - 32px);
  padding:10px 14px 8px;
  border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);
  border-radius:24px;
  background:color-mix(in srgb,var(--white) 76%,transparent);
  box-shadow:0 16px 42px #20261d1f,0 2px 9px #20261d12,inset 0 1px 0 #ffffffc7;
  -webkit-backdrop-filter:blur(18px) saturate(1.25);
  backdrop-filter:blur(18px) saturate(1.25);
}
.mice-palette::before{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:22px;
  pointer-events:none;
  background:linear-gradient(115deg,#ffffff7a 0%,#ffffff18 46%,#dbe4db2b 100%);
}
.mice-palette-items{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
}
.mice-palette-item{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-width:63px;
  min-height:48px;
  padding:4px 8px;
  border:0;
  border-radius:16px;
  background:transparent;
  color:var(--ink);
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  transition:background .14s,transform .14s,box-shadow .14s;
}
.mice-palette-item:hover,.mice-palette-item:focus-visible,.mice-palette-item.selected{
  outline:none;
  background:#ffffff9b;
  box-shadow:inset 0 0 0 1px #ffffffb8,0 2px 10px #2833250b;
}
.mice-palette-item:active{cursor:grabbing;transform:scale(.97)}
.mice-palette-item>span{
  font:23px/1 var(--serif);
}
.mice-palette-item>small{
  margin-top:3px;
  font-size:9px;
  letter-spacing:.01em;
  color:var(--muted);
}
.mice-palette-item.type-M>span{color:#526b50}
.mice-palette-item.type-I>span{color:#557783}
.mice-palette-item.type-C>span{color:#915843}
.mice-palette-item.type-E>span{color:#8c6c2f}
.mice-palette-hint{
  position:relative;
  text-align:center;
  padding-top:4px;
  font-size:9px;
  color:var(--muted);
}
.mice-new-ghost strong{
  font:28px/1 var(--serif);
}

/* Counterplot 7 / dated beats + plot containers */

/* Counterplot 14.3 / deep nesting without nested-box compression.
   Each MICE piece owns its card; ancestry is carried by a quiet left rail.
   Indentation tapers at deeper levels but never drops to zero. */
.page-structure .mice-board .mice-branch{
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  margin:8px 0;
  overflow:visible;
}
.page-structure .mice-board .mice-branch:focus-within{
  box-shadow:none;
}
.page-structure .mice-board .mice-node{
  position:relative;
  background:var(--sheet);
  border:1px solid var(--line);
  border-left:3px solid var(--mice-color,#848877);
  border-radius:4px;
  box-shadow:0 1px 0 #fff8;
}
.page-structure .mice-board .mice-ending{
  position:relative;
  margin:6px 0 0!important;
  background:color-mix(in srgb,var(--mice-color,#888) 3%,var(--sheet));
  border:1px solid var(--line);
  border-left:3px solid var(--mice-color,#848877);
  border-radius:4px;
}
.page-structure .mice-board .mice-children{
  position:relative;
  margin:3px 0 4px calc(var(--nest-space,14px) * .42);
  padding:1px 0 1px calc(var(--nest-space,14px) * .58);
  border-left:1px solid color-mix(in srgb,var(--mice-color,#8b9083) 45%,var(--line));
  min-width:0;
}
.page-structure .mice-board .mice-children>.mice-branch{
  position:relative;
}
.page-structure .mice-board .mice-children>.mice-branch::before{
  content:"";
  position:absolute;
  left:calc(var(--nest-space,14px) * -.58);
  top:25px;
  width:calc(var(--nest-space,14px) * .58);
  border-top:1px solid color-mix(in srgb,var(--mice-color,#8b9083) 45%,var(--line));
  pointer-events:none;
}
.page-structure .mice-board .mice-branch.is-folded>.mice-node{
  background:color-mix(in srgb,var(--mice-color,#888) 2.5%,var(--sheet));
}
.page-structure .mice-layer{
  padding:3px 6px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--paper);
  line-height:1;
}
/* No compounding right gutter: deep children keep the available writing width. */
.page-structure .mice-board .mice-children{
  margin-right:0!important;
}

    function renderLabScope(c) { if (!c)

ew"><span>Ingredients or an earlier consequence changed. Your scene has not been overwritten.</span><button class="text-button" data-action="review-scene" data-id="${s.id}">Review →</button></div>` : ''}<div class="scene-body">${s.alternativeGroup && p().scenes.some(x => x.id !== s.id && !x.archived && x.alternativeGroup === s.alternativeGroup) ? '<div class="callout neutral">Competing draft option: another route from the same situation is also kept. Both are not assumed to happen.</div>' : ''}${s.context ? `<p class="tiny-note"><strong>Situation:</strong> ${esc(s.context)}</p>` : ''}<p>${esc(s.action || 'The visible choice is not yet specified.')}</p>${s.ideaIds?.length?`<div class="theme-links">${s.ideaIds.map(id=>`<button class="theme-link" data-action="used-here" data-id="${id}">Tests · ${esc(entity(id)?.name||'Missing idea')}</button>`).join('')}</div>`:''}<div class="scene-change"><div><div class="eyebrow">WHAT IS DIFFERENT NOW</div><p>${esc(s.after || 'The changed situation is not yet specified.')}</p></div><div><div class="eyebrow">WHAT THIS ASKS NEXT</div><p>${esc(s.next || 'The next pressure is open.')}</p></div></div>${s.notes ? `<details class="details-box"><summary>Scene notes / prose</summary><p>${esc(s.notes)}</p></details>` : ''}</div><footer class="scene-footer"><div class="scene-footer-left"><button class="text-button" data-action="scene-status" data-id="${s.id}">${s.status === 'On the page' ? '✓ On the page' : 'Mark on the page'}</button><button class="icon-btn" data-action="move-scene" data-id="${s.id}" data-direction="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move scene earlier in reading order">↑</button><button class="icon-btn" data-action="move-scene" data-id="${s.id}" data-direction="1" ${i === p().scenes.length - 1 ? 'disabled' : ''} aria-label="Move scene later in reading order">↓</button></div><button class="text-button" data-action="continue-scene" data-id="${s.id}">Continue from this consequence →</button></footer>${enSceneActions(s)     function eligibleParents(id) {
        const byId=new Map(p().scenes.map(s=>[s.id,s]));
        return p().scenes.filter(candidate=>{
            const seen=new Set(), stack=[candidate];
            while(stack.length){const s=stack.pop();if(s.id===id)return false;if(seen.has(s.id))continue;seen.add(s.id);dependencies(s).forEach(d=>{if(byId.has(d.id))stack.push(byId.get(d.id));});}
            return true;
        });
    }

    function showHelp() { ui.modal = { kind: 'help' }; const steps = [['Start with a fragment.', 'Create a blank character and click any empty block. A name is optional. Choose a preset or write your own. Add another block only when it answers something useful.'], ['Let the pieces disagree.', 'Repeat wants, beliefs, or values. Attach them to shared people, places, groups, or objects. Pin a block to exclude it from what-if previews; direct editing is still your decision.'], ['Give the other person a say.', 'Connections have two independent agendas and can change through story time without overwriting their opening terms. World facts can be learned at the opening or after a specific story moment; learning information does not automatically decide what it means.'], ['Try a scene inside the structure.', 'In MICE threads, open Scene Explorer from any thread—or from the page header. A scene can have one primary thread and also serve other existing MICE threads, even across A/B/C plots when strands converge. It remains one canonical scene.'], ['Change one ingredient before deciding.', 'Use “Change just one building block” to compare a replacement under the same situation. The original stays intact until you adopt the change. Some routes may remain unchanged.'], ['Keep the consequence and follow it.', 'Kept scenes belong to Storyline. “Continue from this consequence” carries the prior result forward. Reorder scenes without changing their causal links. Review flags appear when the ingredients change.'], ['Read arcs from actions.', 'The Character choices view gathers scene decisions. Interpret each one as change, steadfastness, doubling down, revelation, or ambiguity. “On the page” is a status you mark after writing, not a quality verdict.'], ['Let consequences land.', 'After something consequential, ask what the outcome makes the viewpoint feel, reconsider, and choose next. Counterplot’s response field is the other person or world answering; inner processing can live in pros     function storyAddendum(){let out=['\n## Plotlines'];for(const pl of plotlines()){const povs=[...new Set((p().structure||[]).filter(n=>nodeAppearsInPlot(n,pl.id)&&n.povId).map(n=>cname(n.povId)))];out.push(`\n### ${plotlineName(pl.id)}${'\n'+enLeadText(pl,'')}${povs.length?'\nPOVs used: '+povs.join(', '):''}${pl.notes?'\n'+pl.notes:''}`);}out.push('\n## Character evolution / story time');for(const [i,m] of moments().entries()){const plot=momentPlotlineId(m),pov=momentPovId(m),relevant=momentRelevantCharacters(m);out.push(`\n### ${i+1}. ${m.date?m.date+' · ':''}After ${m.title}${plot?' · '+plotlineName(plot):''}${pov?' · POV '+cname(pov):''}${relevant.length?' · Relevant: '+relevant.map(cname).join(', '):''}`);for(const c of p().characters){for(const cp of c.stateCheckpoints||[])if(cp.momentId===m.id)out.push('**'+cname(c)+' / saved starting state**',...cp.blocks.map(b=>'- '+KINDS[b.kind].label+': '+btext(b)),'Life status: '+cp.lifeStatus);for(const x of c.lifeChanges||[])if(x.momentId===m.id){const before=CounterplotStory.beforeLifeChange(p(),c,x)?.lifeStatus||(c.lifeStatus==='dead'?'dead':'alive');out.push(`- ${cname(c)} / Life status: ${before} → ${x.status}${x.reason?'\n  Because: '+x.reason:''}`);}for(const x of (c.changes||[]).filter(x=>!x.pinOnly))if(x.momentId===m.id){const before=CounterplotStory.beforeChange(p(),c,x)?.blocks.find(b=>b.id===x.blockId);out.push(`- ${cname(c)} / ${KINDS[x.block?.kind||before?.kind]?.label||'Block'}: ${before?btext(before):'(not present)'} → ${x.operation==='retire'?'(retired)':btext(x.block)}${x.reason?'\n  Because: '+x.reason:''}`);}}for(const e of p().entities.filter(e=>e.type==='fact'))for(const [cid,mid] of Object.entries(e.knownFrom||{}))if(mid===m.id)out.push(`- ${enName(cid)} learns shared fact: ${e.name}`);for(const r of p().connections)for(const x of r.changes||[])if(x.momentId===m.id){const after=connectionState(r,m.id);out.push(`- ${enName(r.a)} ↔ ${enName(r.b)} / Relationship terms: ${after.bond||'Unspecified'};     function showMiceGuide(){ui.modal={kind:'mice-guide'};modal({eyebrow:'MICE / AN ORGANIZING TOOL, NOT A FORMULA',title:'Promises inside promises.',body:`${Object.entries(CounterplotStory.types).map(([key,k])=>`<section class="guide-type"><span class="mice-mark type-${key}">${key==='beat'?'·':key}</span><div><h3>${k.name}</h3><p>${k.hint}</p>${key!=='beat'?`<p><strong>Opening:</strong> ${k.open}<br><strong>Closing:</strong> ${k.close}</p>`:''}</div></section>`).join('')}<p>Outer threads open first and close after their nested threads. Use Focus to work on one branch; Move to change the nesting; a beat for a moment that makes no separate promise.</p><p>Children’s adventures, comedies, tragedies, horror, and quieter lives use the same controls. A closing is not required to be happy, moral, violent, or definitive.</p><p>A Character thread describes an arc. <strong>Record character change here</strong> writes actual block changes at its closing. Nothing is inferred from your prose or automatically marked resolved.</p><p><strong>Inquiry evidence is a separate link from causality.</strong> A fact or scene can support, challenge, or complicate a planned answer without causing that answer. No clue count or fairness score is imposed.</p><p><strong>Plot, protagonist, and POV are different things.</strong> A plot is the A/B/C strand. A plot protagonist anchors that strand. POV belongs to the individual MICE piece or scene, so one plot can move between several viewpoints. Dates are optional chronology metadata and never rewrite manuscript order.</p><p><strong>Master is the canonical outline.</strong> A MICE thread can appear in any number of A/B/C plot lenses without being copied. Its title, opening, closing, nesting, links, and edits remain one shared record. Use Details to choose the plot views where it appears.</p><p class="field-help">Based on the MICE organizational framework and nesting discussion in <a href="https://writingexcuses.com/16-35-what-is-the-m-i-c-e-quotient     function referenceRows(id){
        const rows=[];const seen=new Set();
        const add=(kind,refId,owner,label,detail)=>{const key=[kind,refId,owner,label].join('|');if(!seen.has(key)){rows.push({kind,id:refId,owner:owner||'',label,detail});seen.add(key);}};
        const points=b=>CounterplotStory.relations(b).some(l=>l.targetId===id);
        for(const c of p().characters){
            for(const cp of c.stateCheckpoints||[])for(const b of cp.blocks)if(points(b)||b.kind==='secret'&&(b.knownBy||[]).includes(id))add('checkpoint',cp.momentId,c.id,cname(c)+' · saved starting state','At '+momentName(cp.momentId)+' · '+btext(b));
            for(const b of c.blocks)if(points(b)||b.kind==='secret'&&(b.knownBy||[]).includes(id))add('block',b.id,c.id,cname(c)+' · '+KINDS[b.kind].label,'At the opening'+(c.archived?' · archived person':'')+' · '+btext(b));for(const x of c.changes||[])if(x.block&&(points(x.block)||x.block.kind==='secret'&&(x.block.knownBy||[]).includes(id)))add('change',x.id,c.id,cname(c)+' · '+KINDS[x.block.kind].label,'After '+momentName(x.momentId)+(c.archived?' · archived person':'')+' · '+btext(x.block));}
        for(const c of p().connections)if(c.a===id||c.b===id)add('connection',c.id,'',enName(c.a)+' ↔ '+enName(c.b),'Connection · '+(c.bond==='Unspecified'?'No label yet':c.bond));
        for(const sc of p().scenes){const cast=[sc.focus,sc.partner,...(sc.ensemble||[]).map(x=>x.id)];if(cast.includes(id)||sc.sources?.entities?.includes(id))add('scene',sc.id,'',sc.title||'Untitled scene',(cast.includes(id)?'Scene participant':'Saved scene source')+(sc.archived?' · archived scene':'')+' · '+(sc.momentId?'after '+momentName(sc.momentId):'opening state'));if((sc.ideaIds||[]).includes(id))add('scene',sc.id,'',sc.title||'Untitled scene',`Theme test · Choice: ${sc.action||'Not specified'} · Consequence: ${sc.after||'Not specified'}`);}
        for(const n of CounterplotStory.nodes(p())){if(n.characterId===id||n.targetId===id)add('thread',n.id,'',nodeTitle(n),CounterplotStory.types[n.type].name+' · '+(n.characterId===id?'whose thread':'attached target'));for(const ev of n.evidenceLinks||[])if(ev.sourceType==='fact'&&ev.sourceId===id)add('thread',n.id,'',nodeTitle(n),`Inquiry evidence · ${ev.bearing}${ev.note?' · '+ev.note:''}`);}
        for(const e of p().entities)if(e.type==='fact'&&(e.knownBy||[]).includes(id))add('entity',e.id,'',e.name,'World fact · '+factKnowledgeTiming(e,id));
        const ent=entity(id);if(ent?.type==='fact')for(const a of ent.readerAppearances||[])add('scene',a.sceneId,'',(scene(a.sceneId)?.title||'Missing scene'),`Reader ${a.kind==='shown'?'first shown':'reinterpreted'}${a.note?' · '+a.note:''}`);
        if(ent?.stateLabel)for(const x of ent.stateChanges||[]){const st=entityStateAt(ent,x.momentId),value=st.targetId?tname(st.targetId):(st.value||'Not specified');add('entity-state',x.id,ent.id,ent.name+' · '+ent.stateLabel,`World state · After ${momentName(x.momentId)} · ${value}${x.reason?' · '+x.reason:''}`);}
        rows.push(...enExtendedReferences(id));
        return rows.filter((r,i,a)=>a.findIndex(x=>x.kind===r.kind&&x.id===r.id&&x.owner===r.owner&&x.detail===r.detail)===i);
    }

    function sceneChangeSummary(s){

        if(rels.length)parts.push('Relationship: '+rels.join(' · '));

        const evidence=[];for(const n of CounterplotStory.nodes(p()).filter(n=>n.type==='I'))for(const ev of n.evidenceLinks||[])if(ev.sourceType==='scene'&&ev.sourceId===s.id)evidence.push(`<button class="text-button" data-action="focus-thread" data-id="${n.id}">${esc(nodeTitle(n))} · ${esc(ev.bearing)}</button>`);if(evidence.length)parts.push('Evidence for: '+evidence.join(' · '));

    function enFactionCondition(e){if(!e.stateLabel)return `<p class="field-help"><button class="text-button" data-action="edit-entity" data-id="${e.id}">Track institutional status or another condition ↗</button></p>`;const st=entityStateAt(e,enTime());return `<section class="en-subsection"><div class="en-section-heading"><div><span class="eyebrow">${esc(st.label)}</span><p>${esc(st.targetId?enName(st.targetId):st.value||'Not specified')}</p></div><button class="text-button" data-action="new-entity-state-change" data-id="${e.id}">Change condition →</button></div><p class="field-help">This is the existing World condition, not a second faction field.</p></section>`;}
    function enFactionTies(e,rels){const associated=p().characters.filter(c=>enAssociations(c.id).some(a=>a.id===e.id&&!a.relationship));return `<div class="en-section-heading"><h3 class="en-small-title">People, wings & other organizations</h3><button class="button secondary compact" data-action="en-new-tie" data-entity="${e.id}">+ Add a tie</button></div><p class="field-help">Membership and position are external arrangements. Allegiance stays in the person’s own blocks. Organizational ties have independent directions.</p>${rels.map(r=>enConnectionCard(r,true)).join('')||'<div class="empty-inset">No structured ties recorded.</div>'}${associated.length?`<div class="en-subsection"><span class="eyebrow">ALLEGIANCE LINKS · NOT FORMAL MEMBERSHIP</span>${associated.map(c=>`<p><button class="text-button" data-action="select-character" data-id="${c.id}">${esc(cname(c))} →</button></p>`).join('')}</div>`:''}`;}
    function enFactionKnowledge(e){const facts=p().entities.filter(x=>x.type==='fact'),known=facts.filter(f=>factKnownAt(f,e.id,enTime())),members=new Set(p().connections.filter(r=>(r.a===e.id||r.b===e.id)&&enTerms(r).active&&enTerms(r).membership==='member').map(r=>r.a===e.id?r.b:r.a).filter(id=>char(id))),privateFacts=facts.filter(f=>!known.includes(f)&&[...members].some(id=>factKnownAt(f,id,enTime())));return `<section class="en-subsection"><div class="en-section-heading"><h3 class="en-small-title">Knowledge</h3><button class="text-button" data-action="en-knowledge" data-entity="${e.id}">+ Assign a fact</button></div><p class="field-help">Assigned to the organization does not mean every member knows. Private member knowledge is not a report to the organization.</p><span class="eyebrow">AVAILABLE TO THIS ORGANIZATION</span>${known.map(f=>`<p><button class="text-button" data-action="edit-entity" data-id="${f.id}">${esc(f.name)} →</button></p>`).join('')||'<p class="field-help">None explicitly assigned.</p>'}${privateFacts.length?`<details class="details-box"><summary>Privately known by members · ${privateFacts.length}</summary>${privateFacts.map(f=>`<p><button class="text-button" data-action="edit-entity" data-id="${f.id}">${esc(f.name)}</button><br><small>${[...members].filter(id=>factKnownAt(f,id,enTime())).map(enName).map(esc).join(', ')}</small></p>`).join('')}</details>`:''}</section>`;}
    function enFactionInvolvement(e){const refs=enFactionRefs(e.id),plots=new Set();for(const s of refs.scenes)CounterplotEnsemble.plotIdsFor(p(),s).forEach(id=>plots.add(id));for(const n of refs.threads)for(const id of nodePlotIds(n))plots.add(id);return `<section class="en-subsection"><h3 class="en-small-title">In the story</h3><div class="en-cast-tags">${[...plots].map(id=>`<button class="en-chip" data-action="en-open-plot" data-id="${id}">${esc(plotlineName(id))}</button>`).join('')}</div>${refs.threads.length?`<details class="details-box"><summary>MICE threads · ${refs.threads.length}</summary>${refs.threads.map(n=>`<p><button class="text-button" data-action="focus-thread" data-id="${n.id}">${esc(n.type+' · '+nodeTitle(n))}</button></p>`).join('')}</details>`:''}${refs.scenes.length?`<details class="details-box"><summary>Linked scenes & material changes · ${refs.scenes.length}</summary>${refs.scenes.map(s=>`<p><button class="text-button" data-action="jump-scene" data-id="${s.id}">${esc(s.title)}</button><br><small>${refs.changed.has(s.id)?'Records a material change':'Explicit faction / MICE involvement'}${s.archived?' · archived':''}</small></p>`).join('')}</details>`:'<p class="field-help">No explicit scene involvement yet. A member appearing in a scene does not automatically involve the organization.</p>'}</section>`;}
    function enFactionRefs(id){const changedMids=new Set(),e=entity(id);for(const x of [...(e?.faction?.changes||[]),...(e?.faction?.checkpoints||[]),...(e?.stateChanges||[])])changedMids.add(x.momentId);for(const r of p().connections)if(r.a===id||r.b===id)for(const x of r.changes||[])changedMids.add(x.momentId);for(const f of p().entities.filter(x=>x.type==='fact'))if(f.knownFrom?.[id])changedMids.add(f.knownFrom[id]);const changed=new Set(moments().filter(m=>changedMids.has(m.id)&&m.sceneId).map(m=>m.sceneId));const threads=(p().structure||[]).filter(n=>n.targetId===id||(n.factionIds||[]).includes(id));const ns=new Set(threads.map(n=>n.id));const scenes=p().scenes.filter(s=>changed.has(s.id)||(s.factionIds||[]).includes(id)||ns.has(s.miceId)||(s.miceLinks||[]).some(l=>ns.has(l.miceId)));return {scenes,threads,changed};}
    function enFactionHistory(e){const entries=[{mid:'',label:'Opening working state',note:[...e.faction.blocks.map(b=>KINDS[b.kind].label+': '+btext(b)),entityStateText(e,'')].filter(Boolean).join(' / ')||'No working priorities or tracked condition recorded at the opening.'}];for(const x of e.faction.changes){const before=CounterplotEnsemble.factionBefore(p(),e,x).find(b=>b.id===x.blockId),after=x.operation==='retire'?null:x.block;entries.push({mid:x.momentId,label:(KINDS[after?.kind||before?.kind]?.label||'Block')+' · '+(before?btext(before):'Not yet present')+' → '+(after?btext(after):'Retired'),reason:x.reason,action:'en-faction-block',attrs:`data-entity="${e.id}" data-change="${x.id}"`});}for(const cp of e.faction.checkpoints||[])entries.push({mid:cp.momentId,label:'Saved opening state',note:cp.blocks.map(btext).join(' · ')});for(const r of p().connections.filter(r=>r.a===e.id||r.b===e.id))for(const x of r.changes||[])entries.push({mid:x.momentId,label:enName(r.a)+' ↔ '+enName(r.b),note:enTieSummary(r,x.momentId),reason:x.reason,action:'en-edit-tie',attrs:`data-id="${r.id}" data-change="${x.id}"`});for(const x of e.stateChanges||[])entries.push({mid:x.momentId,label:e.stateLabel+' · '+(x.targetId?enName(x.targetId):x.value),reason:x.reason,action:'edit-entity-state-change',attrs:`data-entity="${e.id}" data-id="${x.id}"`});for(const f of p().entities.filter(x=>x.type==='fact'&&(x.knownBy||[]).includes(e.id)))if(f.knownFrom?.[e.id])entries.push({mid:f.knownFrom[e.id],label:'Organization learns · '+f.name,action:'edit-entity',attrs:`data-id="${f.id}"`});return `<p class="field-help">One chronological view of the faction’s own changes and the Connections and Facts that affect it.</p>${enHistoryMarkup(entries)||'<div class="empty-inset">No changes recorded yet. Opening details stay in effect.</div>'}`;}
    function enTieSummary(r,mid=enTime()){const t=enTerms(r,mid),st=connectionState(r,mid);if(!t.active)return 'No active tie at this moment';const org=enGroup(r.a)||enGroup(r.b);if(!org)return st.bond;return [enGroup(r.a)&&enGroup(r.b)?[t.aTie&&enName(r.a)+' → '+t.aTie,t.bTie&&enName(r.b)+' → '+t.bTie].filter(Boolean).join(' / '):({member:'Member',associate:'Associate',former:'Former member',none:'No formal membership',unspecified:'Tie'}[t.membership]),t.position,t.leadership?'Leadership':'',t.visibility==='concealed'?'Concealed':t.visibility==='contested'?'Contested':'',st.bond==='Unspecified'?'':st.bond].filter(Boolean).join(' · ')||'Terms not specified';}
    function enConnectionCard(r,compact=false){const st=connectionState(r,enTime()),t=enTerms(r),org=enGroup(r.a)||enGroup(r.b),canScene=!!char(r.a)&&!!char(r.b);return `<article class="connection-card en-connection ${compact?'en-compact':''} ${t.active?'':'en-inactive'}" id="connection-${r.id}"><header class="connection-head"><div><span class="eyebrow">${org?'ORGANIZATIONAL TIE':'PERSONAL CONNECTION'}${t.visibility==='concealed'?' · CONCEALED':''}</span><h2>${esc(enName(r.a))}<span>↔</span>${esc(enName(r.b))}</h2><p class="field-help">${esc(enTieSummary(r))}</p></div><button class="icon-btn" data-action="en-edit-tie" data-id="${r.id}" aria-label="Edit connection between ${esc(enName(r.a))} and ${esc(enName(r.b))}">${ICONS.edit}</button></header>${t.active&&(st.aWant||st.bWant)?`<div class="connection-directions"><div class="direction"><div class="eyebrow">${esc(enName(r.a))} SEEKS</div><p>${esc(st.aWant||'Not specified')}</p></div><div class="direction"><div class="eyebrow">${esc(enName(r.b))} SEEKS</div><p>${esc(st.bWant||'Not specified')}</p></div></div>`:''}${st.notes?`<p class="en-connection-note">${esc(st.notes)}</p>`:''}<footer class="connection-footer"><div class="inline-actions"><button class="text-button" data-action="en-edit-tie" data-id="${r.id}" data-mode="change">Record a change →</button><button class="text-button" data-action="en-edit-tie" data-id="${r.id}" data-mid="">Opening terms</button>${canScene?`<button class="text-button" data-action="test-connection" data-id="${r.id}">Try a scene →</button>`:''}${t.factId?`<button class="text-button" data-action="edit-entity" data-id="${t.factId}">Knowledge & reader disclosure ↗</button>`:''}</div></footer>${(r.changes||[]).length?`<details class="connection-history"><summary>${r.changes.length} changes in story time</summary>${CounterplotEnsemble.events(p(),r.changes,moments().at(-1)?.id||'').map(x=>`<div class="connection-history-item"><strong>${esc(enMomentText(x.momentId))}</strong><p>${esc(enTieSummary(     function enRenderConnections(){const filter=ui.enConnections||'all',rs=p().connections.filter(r=>filter==='all'||(filter==='people'?char(r.a)&&char(r.b):enGroup(r.a)||enGroup(r.b)));return heading('02 / CONNECTIONS','People. Organizations. Unequal deals.','Each side keeps an independent agenda. Membership is not allegiance; a label does not grant knowledge.',`<button class="button compact" data-action="en-new-tie">+ Connection</button>`)+`<div class="en-context-row">${enTimeControls('Terms at')}<label class="en-time-label"><span>Show</span><select data-en-connections><option value="all" ${filter==='all'?'selected':''}>All connections</option><option value="people" ${filter==='people'?'selected':''}>Between people</option><option value="organizations" ${filter==='organizations'?'selected':''}>Organizational ties</option></select></label></div>${rs.map(r=>enConnectionCard(r)).join('')||'<div class="empty-inset">No connections in this view. A name and one agenda are enough to begin.</div>'}${filter!=='organizations'?enSharedStakes():''}`;}

    function enRenderEditor(){const m=ui.modal,d=m.draft;let title='',body='',description='',eyebrow='STORY TIME / CHANGE ONLY WHAT CHANGES';

function sourceSignatureV14(sources, override = null) {
        const people = sources.characters.map(id => {
            const c = char(id);
            if (!c) return null;
            const cp = sources.timeline ? CounterplotStory.state(p(),c,sources.momentId||'') : clone(c);

            if (override && c.id === override.character) { const index = cp.blocks.findIndex(b => b.id === override.block.id); if (index >= 0) cp.blocks[index] = clone(override.block); }
            cp.blocks.forEach(b => delete b.locked); return cp;
        });
        const viewpoint=sources.characters[0]||'';
        const sourceEntities=sources.entities.map(id=>{const e=entity(id);if(!e)return null;if(e.type==='fact'){const known=factKnownAt(e,viewpoint,sources.timeline?sources.momentId||'':'');return known?{id:e.id,type:e.type,name:e.name,notes:e.notes,known:true,knownFrom:e.knownFrom?.[viewpoint]||''}:{id:e.id,type:e.type,name:e.name,known:false};}const st=entityStateAt(e,sources.timeline?sources.momentId||'':'');return {id:e.id,type:e.type,name:e.name,notes:e.notes,state:st?.label?st:null};});
        const world = { setting: p().world.setting, reality: p().world.reality, notes: p().world.notes };
        const at=sources.timeline?sources.momentId||'':'',cast=(sources.cast||sources.characters||[]).filter(id=>char(id));
        const base={ characters: people, entities: sourceEntities, connection: sources.connection?connectionState(connection(sources.connection),at):null, world };
        base.sharedKnowledge=p().entities.filter(e=>e.type==='fact'&&factKnownAt(e,viewpoint,at)).map(e=>({id:e.id,name:e.name,notes:e.notes,from:e.knownFrom?.[viewpoint]||''}));
        base.connections=p().connections.filter(r=>cast.includes(r.a)&&cast.includes(r.b)).map(r=>connectionState(r,at));
        if(sources.range)base.world.range=CounterplotNarrative.range(p());
        if(sources.timeline){base.changeEvidence=sources.characters.flatMap(id=>[...CounterplotStory.changesThrough(p(),char(id),sources.momentId||'').map(x=>{const m=moments().find(v=>v.id===x.momentId);return {id:x.id,reason:x.reason,direction:x.direction,moment:m?.title||'',cause:m?.sceneId?scene(m.sceneId)?.after||'':''};}),...CounterplotStory.lifeChangesThrough(p(),char(id),sources.momentId||'').map(x=>{const m=moments().find(v=>v.id===x.momentId);return {id:x.id,kind:'life',status:x.status,reason:x.reason,moment:m?.title||'',cause:m?.sceneId?scene(m.sceneId)?.after||'':''};})]);}
        const threadIds=[sources.miceId,...(sources.miceIds||[])].filter(Boolean);if(threadIds.length)base.threads=threadIds.map(id=>{const n=storyNode(id);return n?[...CounterplotStory.ancestors(p(),n.id),n].map(x=>({id:x.id,parentId:x.parentId,type:x.type,opening:x.opening,closing:x.closing,characterId:x.characterId,povId:x.povId,targetId:x.targetId,targetName:tname(x.targetId),plotlineId:x.plotlineId,plotlineIds:[...(x.plotlineIds||[])]})):null;});
        return hash(base);
    }

'use strict';
/* Pure three-way merge. Conflicting prose is never resolved by last-write-wins. */
const CounterplotSyncCore=(()=>{

 const canonical=x=>Array.isArray(x)?x.map(canonical):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,canonical(x[k])])):x;

 const identified=x=>Array.isArray(x)&&x.every(v=>v&&typeof v==='object'&&typeof v.id==='string')&&new Set(x.map(v=>v.id)).size===x.length;

 function mergeValue(base,local,remote,path,conflicts){
  if(equal(local,remote))return copy(local);
  if(equal(base,local))return copy(remote);
  if(equal(base,remote))return copy(local);
  if(path.endsWith('.updatedAt')&&typeof local==='string'&&typeof remote==='string')return local>remote?local:remote;
  if(identified(base)&&identified(local)&&identified(remote)){
   const bm=new Map(base.map(x=>[x.id,x])),lm=new Map(local.map(x=>[x.id,x])),rm=new Map(remote.map(x=>[x.id,x]));
   const baseOrder=base.map(x=>x.id).filter(id=>lm.has(id)&&rm.has(id));
   const lo=local.map(x=>x.id).filter(id=>baseOrder.includes(id)),ro=remote.map(x=>x.id).filter(id=>baseOrder.includes(id));
   if(!equal(lo,ro)&&!equal(lo,baseOrder)&&!equal(ro,baseOrder))conflicts.push(path+'.order');
   const lead=!equal(lo,baseOrder)&&equal(ro,baseOrder)?local:remote;
   const order=[...new Set([...lead,...local,...remote,...base].map(x=>x.id))];
   return order.map(id=>mergeValue(bm.get(id),lm.get(id),rm.get(id),path+'.'+id,conflicts)).filter(x=>x!==undefined);
  }
  if(plain(base)&&plain(local)&&plain(remote)){
   const result=[];for(const key of new Set([...Object.keys(base),...Object.keys(local),...Object.keys(remote)])){
    const value=mergeValue(base[key],local[key],remote[key],path+'.'+key,conflicts);if(value!==undefined)result.push([key,value]);
   }return Object.fromEntries(result);
  }

 }
 function merge(base,local,remote,idFactory=id){
  if(!remote)return {workspace:copy(local),conflicts:[],forks:[]};
  if(!base)return {workspace:copy(remote),conflicts:[],forks:[]};
  const result=copy(remote), bm=new Map(base.projects.map(x=>[x.id,x])),lm=new Map(local.projects.map(x=>[x.id,x])),rm=new Map(remote.projects.map(x=>[x.id,x]));

   const issues=[], l=lm.get(id),r=rm.get(id), b=bm.get(id);const merged=mergeValue(b,l,r,'projects.'+id,issues);
   if(merged)result.projects.push(merged);
   if(issues.length&&l){const fork=copy(l);fork.id=idFactory();fork.version=(fork.version||'Draft')+' · preserved device version';fork.updatedAt=new Date().toISOString();result.projects.push(fork);forks.push(fork.id);}
   conflicts.push(...issues);
  }
  // Project switching is interface state, not a conflict in the story.
  result.active=result.projects.some(p=>p.id===local.active)?local.active:result.projects[0]?.id;
  if(!result.projects.length){result.projects=copy(local.projects);result.active=local.active;}
  return {workspace:result,conflicts,forks};

})();

</script>
<script>
'use strict';
(() => {

 const box=(title,text,actions=[])=>{shield.replaceChildren();const inner=document.createElement('div');inner.className='sync-panel-inner';const h=document.createElement('h1');h.textContent=title;const p=document.createElement('p');p.textContent=text;inner.append(h,p);for(const [label,run]of actions){const button=document.createElement('button');button.className='button secondary';button.textContent=label;button.addEventListener('click',run);inner.append(button);}shield.append(inner);shield.hidden=false;};
 const status=()=>!ready?'Connecting to private workspace…':networkIssue?(pending||inflight?'Offline / sign-in needed · not yet synced':'Offline · last server save retained'):cacheIssue?'Local recovery unavailable · '+(pending?'saving…':'server copy saved'):remoteWaiting?'Changes elsewhere · finish this edit':pending?'Saving across devices…':lastSynced?'Saved across devices':'Connected · not saved yet';
 const problem=()=>!!(networkIssue||cacheIssue||remoteWaiting);
 const paint=()=>bridge.saveStatus();
 async function openCache(){return new Promise((resolve,reject)=>{const request=indexedDB.open('counterplot-private-v2',1);request.onupgradeneeded=()=>request.result.createObjectStore('workspaces');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
 async function cacheOp(method,value){if(!cache)return null;return new Promise((resolve,reject)=>{const tx=cache.transaction('workspaces',method==='get'||method==='getAll'?'readonly':'readwrite'),store=tx.objectStore('workspaces');let req;if(method==='put')req=store.put(value,slot);else if(method==='get')req=store.get(slot);else if(method==='getAll')req=store.getAll();else req=store.delete(slot);tx.oncomplete=()=>resolve(req.result);tx.onerror=()=>reject(tx.error||req.error);tx.onabort=()=>reject(tx.error||new Error('Local recovery write aborted'));});}

 function showNotice(text){let el=document.querySelector('.sync-live-notice');if(!el){el=document.createElement('div');el.className='sync-live-notice';el.setAttribute('role','status');document.body.append(el);}el.replaceChildren();const span=document.createElement('span');span.textContent=text;const button=document.createElement('button');button.className='text-button';button.textContent=' Dismiss';button.addEventListener('click',()=>el.remove());el.append(span);if(text.includes('versions')){const review=document.createElement('button');review.className='text-button';review.textContent=' Open versions';review.addEventListener('click',()=>document.querySelector('[data-action=projects]').click());el.append(review);}el.append(button);}
 async function flush(){
  if(!ready||busy)return;busy=true;

   if(remoteWaiting){if(bridge.isEditing())return;mergeRemote(remoteWaiting);remoteWaiting=null;await persist();}
   if(!pending&&!inflight)return;

 async function poll(){

 async function boot(){
  box('Your private workshop.','Connecting to your account before displaying any saved story.');
  try{
   const session=await api('session');user=session.user;email=session.email;slot=user+':'+tab;
   try{cache=await openCache();}catch{cacheIssue='Browser recovery storage is unavailable';}
   const saved=await cacheOp('get'), remote=await api('workspace');
   if(saved?.owner===user&&saved.pending){base=saved.base;revision=saved.revision;pending=bridge.validate(saved.pending);inflight=saved.inflight||null;if(remote.workspace){mergeRemote(remote);}else{bridge.replace(pending);base=null;revision=0;inflight=null;}}
   else if(remote.workspace){base=bridge.validate(remote.workspace);revision=remote.revision;bridge.replace(base);lastSynced=new Date().toISOString();}
   else{base=null;revision=0;pending=bridge.snapshot();}
   ready=true;networkIssue='';shield.hidden=true;await persist();paint();
   const other=(await cacheOp('getAll')||[]).filter(x=>x.owner===user&&x.slot!==slot&&x.pending);
   if(other.length)showNotice('This browser also has unfinished work from another tab or earlier session. Open the save status to recover it without replacing current work.');
   if(pending)void flush();
  }catch(e){networkIssue=e.message;box('Not connected yet.',e.message+'. No private workspace has been replaced. Signing in requires the deployed site’s authorized account.',[['Try again',boot],['Sign in again',()=>location.reload()]]);paint();}
 }
 async function details(){
  const text=[email?('Account: '+email+'.'):'',status()+'.','Changes appear on another connected device after the server confirms the save. Simultaneous conflicting edits are preserved as separate project versions.',cacheIssue?'Local recovery is currently unavailable. Keep this tab open until the server confirms your save.':'A local recovery copy covers ongoing edits if the connection drops. An offline cold launch still requires sign-in before showing private data.'].join(' ');
  box('Your work, across devices.',text,[['Back to writing',()=>shield.hidden=true],['Retry connection',async()=>{shield.hidden=true;await poll();}],['Saved revisions',showHistory],['Recover another tab’s work',recoverTabs],['Sign out on this device',signOut]]);
 }
 async function showHistory(){try{const result=await api('history');box('Saved revisions.','Recover a revision as additional project versions. Your current projects will remain intact. The server retains up to 100 recent saves; the latest 30 are listed here.',[['Back',details],...result.revisions.slice(0,30).map(r=>['Revision '+r.revision+' · '+new Date(r.updatedAt).toLocaleString(),async()=>{const saved=await api('workspace?revision='+r.revision);appendRecovery(saved.workspace,'recovered revision '+r.revision);shield.hidden=true;}])]);}catch(e){box('History unavailable.',e.message,[['Back',details]]);}}

  if(pending||inflight||remoteWaiting){await flush();if(pending||inflight||remoteWaiting){box('Finish saving before signing out.','There are changes the server has not confirmed. They remain in this session; reconnect before signing out.',[['Back to writing',()=>shield.hidden=true],['Retry',async()=>{await flush();await details();}]]);return;}}

  location.assign('/cdn-cgi/access/logout');

})();
